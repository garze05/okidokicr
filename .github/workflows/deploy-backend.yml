name: Deploy backend to Oracle Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Connect via SSH and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}
          script: |
            # Load environment (nvm, node, etc.)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

            # Also try to load from common locations
            [ -s "$HOME/.bashrc" ] && source "$HOME/.bashrc"
            [ -s "$HOME/.profile" ] && source "$HOME/.profile"

            cd ~/okidokicr
            git pull origin main
            cd api
            npm install --frozen-lockfile || npm install
            npx prisma generate
            npx prisma db push --accept-data-loss
            pm2 restart okidoki-api
